[tool.poetry]
name = "r4agent"
version = "0.1.11"
description = ""
authors = ["rag0nn <enes_trhn_8@outlook.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"

# --- Çekirdek (Core) Bağımlılıklar ---
pydantic = "^2.0"
httpx = "^0.27"
requests = "^2.31"
numpy = "^1.26"
python-dotenv = "^1.0"
protobuf = "^4.25"

# --- Opsiyonel Alt Modül Bağımlılıkları ---
docling = { version = "^2.0", optional = true }
mcp = { version = "^1.0", optional = true }
qdrant-client = { version = "^1.8", optional = true }
textual = { version = "^0.50", optional = true }
rich = { version = "^13.0", optional = true }
fastapi = { version = "^0.110", optional = true } 
uvicorn = { version = "^0.28", optional = true }
ollama = { version = "^0.1", optional = true }
google-genai = { version = "^2.17", optional = true }
faster-whisper = { version = "^1.2", optional = true }
onnxruntime = { version = "^1.29", optional = true }
transformers = { version = "^5.12", optional = true }

[tool.poetry.extras]
# Tekil/Mantıksal Modül Ekstraları
docling = ["docling"]
mcp = ["mcp"]
qdrant = ["qdrant-client"]
tui = ["textual", "rich"]
api = ["fastapi", "uvicorn"]
ollama = ["ollama"]
genai = ["google-genai"]
audio = ["faster-whisper", "onnxruntime"]
ml = ["transformers"]

# Tüm opsiyonel paketleri tek seferde yükleyen ekstra
all = [
    "docling",
    "mcp",
    "qdrant-client",
    "textual",
    "rich",
    "fastapi",
    "uvicorn",
    "ollama",
    "google-genai",
    "faster-whisper",
    "onnxruntime",
    "transformers"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"